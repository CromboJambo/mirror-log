[package]
name = "mirror-log"
version = "0.1.8"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Append-only event log for personal knowledge management with semantic chunking using SQLite."
homepage = "https://github.com/CromboJambo"
repository = "https://github.com/CromboJambo/mirror-log"
authors = ["Dustin Grover <dustinjgrover@gmail.com>"]
readme = "README.md"
keywords = ["log", "knowledge-management", "SQLite", "append-only", "chunking"]
categories = ["command-line-utilities", "data-structures", "database"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1.10", features = ["v4"] }
chrono = "0.4"
sha2 = "0.10"
rand = "0.8"

# Required for embedding support
tokenizers = { version = "0.20", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = { version = "1.0" }
tracing = { version = "0.1", optional = true }

# Inference support (optional)
arboard = { version = "3.4", optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
tokio = { version = "1.36", features = ["full"], optional = true }

[features]
default = []
embedding = ["tokenizers", "tracing"]
inference = ["tokio", "reqwest", "tracing"]
iteration = []
clipboard = ["arboard", "tokio"]

[lib]
name = "mirror_log"
path = "src/lib.rs"

[profile.release]
strip = true
opt-level = "z"
lto = true

[[bin]]
name = "mirror-log"
path = "src/bin/mirror_log.rs"
