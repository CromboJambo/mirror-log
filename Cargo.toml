[package]
name = "mirror-log"
version = "0.1.5"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Append-only event log for personal knowledge management with semantic chunking using SQLite."
homepage = "https://github.com/CromboJambo"
repository = "https://github.com/CromboJambo/mirror-log"
authors = ["Dustin Grover <dustinjgrover@gmail.com>"]
readme = "README.md"
keywords = ["log", "knowledge-management", "SQLite", "append-only", "chunking"]
categories = ["command-line-utilities", "data-structures", "database"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1.10", features = ["v4"] }
chrono = "0.4"
sha2 = "0.10"
polars = { version = "0.36", features = ["parquet"] }
polars-sql = "0.52.0"
rand = "0.8"

# Embedding and vector dependencies
# Using tokenizers for efficient text tokenization
tokenizers = "0.20"
# Using rust-bert for embedding generation (optional - remove if not needed)
rust-bert = { version = "0.23", optional = true }
# Using hf-hub for loading models (optional - remove if not needed)
hf-hub = { version = "0.3", optional = true }
# Using ndarray for vector operations
ndarray = "0.15"
# Using approx for numerical comparisons
approx = "0.5"

[features]
default = []
embedding = ["rust-bert", "hf-hub"]

[lib]
name = "mirror_log"
path = "src/lib.rs"

[profile.release]
strip = true
opt-level = "z"
lto = true
